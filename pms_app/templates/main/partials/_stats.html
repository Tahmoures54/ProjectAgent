{# Path: pms_app/templates/main/partials/_stats.html #}
{% set days = free_days|default(90) %}
{% set days_label = free_days_fa|default(days) %}
<section class="stats" aria-label="مشخصات محصول">
    <div class="container">
        <div class="stats__grid">
            <div class="stat-card" data-counter data-target="{{ days }}">
                <div class="stat-card__value"><span class="counter">0</span></div>
                <div class="stat-card__label">روز آزمایش رایگان</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__value">EVM</div>
                <div class="stat-card__label">CPI، SPI، EAC و S-Curve</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__value">۴</div>
                <div class="stat-card__label">سطح مشاهده کانسرن</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__value">CBS</div>
                <div class="stat-card__label">قرارداد، آیتم و ورود اکسل</div>
            </div>
        </div>
    </div>
</section>
